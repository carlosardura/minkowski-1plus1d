name: "CI pipeline"
on: [push, pull_request]

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps: 
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install .[dev]
      - name: Run static typing analysis
        run: mypy minkowski/
      - name: Run unit tests
        run: pytest -v